name = "cool-tools"
main = "src/index.js"
compatibility_date = "2025-10-01"

# The whole site — hub page + every tool — is served by this Worker, so the
# pages and the APIs share one origin. Each tool lives in its own folder here.
[assets]
directory = "../site"
binding = "ASSETS"

# Shared by all tools. Add more bindings here if a future tool needs them.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tool-uploads"

[[kv_namespaces]]
binding = "JOBS"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

[vars]
# owner/repo that holds this project — the workflows live there.
GITHUB_REPO = "your-username/your-repo"
MAX_UPLOAD_MB = "100"

# Run once:
#   npx wrangler secret put GITHUB_TOKEN
